<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <title>404 DEV | Forum — Developer's Hub</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230b0f1a'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' font-weight='bold' font-family='monospace' fill='%2300f0ff' stroke='%23ff004c' stroke-width='3' filter='url(%23glow)'%3E404%3C/text%3E%3Cdefs%3E%3Cfilter id='glow'%3E%3CfeGaussianBlur stdDeviation='2' result='coloredBlur'/%3E%3CfeMerge%3E%3CfeMergeNode in='coloredBlur'/%3E%3CfeMergeNode in='SourceGraphic'/%3E%3C/feMerge%3E%3C/filter%3E%3C/defs%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(ellipse at 30% 40%, #0a0c18, #020408);
      color: #eef5ff;
      transition: background 0.2s, color 0.2s;
      overflow-x: hidden;
      line-height: 1.5;
    }

    body.light {
      background: #f0f4fa;
      color: #0f172a;
    }

    /* ========== GLASS MORPHISM NAVBAR ========== */
    .navbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.8rem 1.5rem;
      background: rgba(5, 10, 20, 0.75);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(0, 240, 255, 0.3);
      position: sticky;
      top: 0;
      z-index: 1100;
      transition: all 0.2s;
    }

    body.light .navbar {
      background: rgba(255, 255, 255, 0.85);
      border-bottom: 1px solid rgba(0, 0, 0, 0.1);
    }

    .navbar a, .navbar button {
      color: #e0f0ff;
      text-decoration: none;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 60px;
      transition: all 0.2s ease;
      background: rgba(0, 240, 255, 0.05);
      border: 1px solid rgba(0, 240, 255, 0.2);
      font-size: 0.9rem;
      cursor: pointer;
    }

    body.light .navbar a, body.light .navbar button {
      color: #0f172a;
      background: rgba(0, 0, 0, 0.03);
      border-color: rgba(0, 0, 0, 0.1);
    }

    .navbar a:hover, .navbar button:hover {
      background: rgba(0, 240, 255, 0.2);
      transform: translateY(-2px);
      border-color: #00f0ff;
    }

    /* Container */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    /* Glass card styling */
    .glass-card {
      background: rgba(12, 18, 28, 0.7);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      border: 1px solid rgba(0, 240, 255, 0.2);
      padding: 1.5rem;
      margin-bottom: 1.8rem;
      transition: transform 0.2s ease, box-shadow 0.2s;
    }

    body.light .glass-card {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(0, 0, 0, 0.08);
      color: #0f172a;
    }

    .glass-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(0, 240, 255, 0.1);
      border-color: #00f0ff80;
    }

    /* Forum thread cards */
    .thread-card {
      background: rgba(20, 28, 44, 0.8);
      border-radius: 24px;
      padding: 1.3rem;
      margin-bottom: 1.2rem;
      transition: all 0.25s;
      border: 1px solid rgba(0, 240, 255, 0.2);
    }

    body.light .thread-card {
      background: rgba(240, 245, 250, 0.9);
      border-color: rgba(0, 0, 0, 0.05);
    }

    .thread-card:hover {
      transform: translateY(-4px);
      border-color: #ff3b7c;
      box-shadow: 0 15px 25px rgba(0, 0, 0, 0.2);
    }

    .thread-title {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      background: linear-gradient(120deg, #fff, #00f0ff);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    body.light .thread-title {
      background: linear-gradient(120deg, #0f2b5e, #c81e6b);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    .thread-meta {
      font-size: 0.75rem;
      opacity: 0.7;
      margin-bottom: 0.8rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .btn-primary, .btn, .btn-small {
      background: linear-gradient(95deg, #0f2b5e, #c81e6b);
      border: none;
      padding: 10px 24px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      color: white;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
    }

    .btn-small {
      padding: 6px 16px;
      font-size: 0.8rem;
    }

    .btn-primary:hover, .btn:hover, .btn-small:hover {
      transform: scale(0.97);
      filter: brightness(1.08);
      box-shadow: 0 6px 14px rgba(0, 240, 255, 0.3);
    }

    /* Modal overlay (unified) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 1rem;
    }

    .modal-box {
      background: #0e1222;
      border: 2px solid #ff3b7c;
      border-radius: 32px;
      width: 100%;
      max-width: 550px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 1.8rem;
      box-shadow: 0 30px 40px rgba(0, 0, 0, 0.5);
      animation: fadeSlideUp 0.2s ease;
    }

    body.light .modal-box {
      background: #ffffff;
      border-color: #c81e6b;
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .modal-box h2, .modal-box h3 {
      margin-bottom: 1rem;
      color: #00f0ff;
    }

    .modal-box textarea, .modal-box input {
      width: 100%;
      padding: 12px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid #ff3b7c;
      border-radius: 20px;
      color: white;
      margin-bottom: 1rem;
      font-family: inherit;
    }

    body.light .modal-box textarea, body.light .modal-box input {
      background: #f0f2f5;
      color: #0f172a;
      border-color: #c81e6b;
    }

    .comment-item {
      background: rgba(0, 240, 255, 0.05);
      border-left: 3px solid #ff3b7c;
      padding: 10px;
      margin: 12px 0;
      border-radius: 16px;
    }

    /* Contact admin button */
    .contact-admin-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: linear-gradient(135deg, #ff3b7c, #ff0055);
      color: white;
      border: none;
      border-radius: 60px;
      padding: 14px 22px;
      cursor: pointer;
      z-index: 1050;
      font-weight: bold;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.2s;
    }

    .contact-admin-btn:hover {
      transform: scale(1.02);
      background: linear-gradient(135deg, #ff1f62, #e6004c);
    }

    /* Responsive design */
    @media (max-width: 768px) {
      .navbar {
        padding: 0.6rem 1rem;
        gap: 0.4rem;
        justify-content: space-between;
        flex-wrap: wrap;
      }
      .navbar a, .navbar button {
        padding: 6px 12px;
        font-size: 0.75rem;
      }
      .container {
        padding: 1.2rem;
      }
      .glass-card, .thread-card {
        padding: 1rem;
      }
      .thread-title {
        font-size: 1.2rem;
      }
      .btn-primary, .btn {
        padding: 8px 16px;
        font-size: 0.8rem;
      }
      .modal-box {
        padding: 1.2rem;
        max-height: 80vh;
      }
      .contact-admin-btn {
        bottom: 16px;
        right: 16px;
        padding: 10px 16px;
        font-size: 0.8rem;
      }
    }

    @media (max-width: 480px) {
      .navbar a, .navbar button {
        padding: 5px 10px;
        font-size: 0.7rem;
      }
      .thread-meta {
        font-size: 0.7rem;
      }
      .modal-box h2 {
        font-size: 1.4rem;
      }
    }

    /* loading state */
    .loading-spinner {
      text-align: center;
      padding: 2rem;
      color: #00f0ff;
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.75rem;
      opacity: 0.6;
    }

    i {
      margin-right: 6px;
    }

    hr {
      border-color: #00f0ff30;
      margin: 1rem 0;
    }
  </style>
</head>
<body>
<div class="navbar">
  <a href="/user-dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
  <a href="/coding-hub.html"><i class="fas fa-code"></i> Coding Hub</a>
  <a href="/forum.html"><i class="fas fa-comments"></i> Forum</a>
  <a href="/playground.html"><i class="fas fa-flask"></i> Playground</a>
  <a href="/toolkit.html"><i class="fas fa-toolbox"></i> Toolkit</a>
  <a href="/messages.html"><i class="fas fa-envelope"></i> Messages</a>
  <button id="themeToggle" class="btn-small"><i class="fas fa-moon"></i> Theme</button>
  <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a>
</div>

<div class="container">
  <div class="glass-card" style="text-align: center;">
    <h1 style="font-size: 1.8rem;"><i class="fas fa-comment-dots"></i> Developer Forum</h1>
    <p>Connect, share knowledge, and debug together ✨</p>
    <button id="newThreadBtn" class="btn-primary"><i class="fas fa-plus-circle"></i> Create New Thread</button>
  </div>
  <div id="threadsList">
    <div class="loading-spinner"><i class="fas fa-spinner fa-pulse"></i> Loading discussions...</div>
  </div>
</div>

<button id="contactAdminBtn" class="contact-admin-btn"><i class="fas fa-envelope"></i> Contact Admin</button>

<!-- dynamic modals will be injected -->
<script>
  // ========== HELPER: AUTH FETCH (PRESERVED) ==========
  async function fetchAuth(url, options = {}) {
    const token = localStorage.getItem('token');
    if (!token) { window.location.href = '/login.html'; return; }
    const headers = { 'Content-Type': 'application/json', ...options.headers };
    if (token) headers['Authorization'] = `Bearer ${token}`;
    const res = await fetch('/api' + url, { ...options, headers });
    if (res.status === 401) { localStorage.removeItem('token'); window.location.href = '/login.html'; throw new Error('Unauthorized'); }
    return res;
  }

  // escape HTML
  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  // ========== LOAD THREADS ==========
  async function loadThreads() {
    const container = document.getElementById('threadsList');
    try {
      const res = await fetchAuth('/threads');
      if (!res) return;
      const threads = await res.json();
      if (!threads.length) {
        container.innerHTML = `<div class="glass-card" style="text-align:center">✨ No threads yet. Be the first to start a discussion!</div>`;
        return;
      }
      container.innerHTML = '';
      for (const thread of threads) {
        const card = document.createElement('div');
        card.className = 'thread-card';
        card.innerHTML = `
          <div class="thread-title">${escapeHtml(thread.title)}</div>
          <div class="thread-meta">
            <span><i class="fas fa-user-astronaut"></i> ${escapeHtml(thread.authorName)} ${thread.authorVerified ? '✅' : ''}</span>
            <span><i class="far fa-calendar-alt"></i> ${new Date(thread.createdAt).toLocaleString()}</span>
            <span><i class="fas fa-comment"></i> ${thread.comments?.length || 0} comments</span>
          </div>
          <p style="margin-bottom: 12px;">${escapeHtml(thread.content.substring(0, 180))}${thread.content.length > 180 ? '...' : ''}</p>
          <button class="btn-small view-thread" data-id="${thread.id}"><i class="fas fa-eye"></i> Read & Comment</button>
        `;
        container.appendChild(card);
      }
      document.querySelectorAll('.view-thread').forEach(btn => {
        btn.addEventListener('click', () => showThreadModal(btn.dataset.id));
      });
    } catch (err) {
      console.error(err);
      container.innerHTML = `<div class="glass-card" style="border-color:#ff004c">⚠️ Error loading threads. Please refresh.</div>`;
    }
  }

  // ========== THREAD MODAL (BEAUTIFIED) ==========
  async function showThreadModal(threadId) {
    try {
      const res = await fetchAuth('/threads');
      if (!res) return;
      const threads = await res.json();
      const thread = threads.find(t => t.id == threadId);
      if (!thread) return;

      // Create overlay modal
      const modalDiv = document.createElement('div');
      modalDiv.className = 'modal-overlay';
      modalDiv.innerHTML = `
        <div class="modal-box" style="max-width:700px;">
          <h2><i class="fas fa-comments"></i> ${escapeHtml(thread.title)}</h2>
          <div class="thread-meta" style="margin-bottom:1rem;">
            <span><i class="fas fa-user"></i> ${escapeHtml(thread.authorName)} ${thread.authorVerified ? '✅' : ''}</span>
            <span><i class="far fa-clock"></i> ${new Date(thread.createdAt).toLocaleString()}</span>
          </div>
          <div style="background:rgba(0,240,255,0.05); padding:1rem; border-radius:20px; margin-bottom:1rem;">
            ${escapeHtml(thread.content)}
          </div>
          <hr>
          <h3><i class="fas fa-reply-all"></i> Comments (${thread.comments?.length || 0})</h3>
          <div id="commentsListModal" style="max-height: 250px; overflow-y: auto; margin: 1rem 0;"></div>
          <textarea id="newCommentText" rows="2" placeholder="Write your insight or solution..." style="width:100%; margin:0.5rem 0;"></textarea>
          <div style="display: flex; gap: 10px; justify-content: flex-end;">
            <button id="postCommentBtnModal" class="btn-primary" data-id="${thread.id}"><i class="fas fa-paper-plane"></i> Post Comment</button>
            <button id="closeModalBtn" class="btn-small" style="background:#333;">Close</button>
          </div>
        </div>
      `;
      document.body.appendChild(modalDiv);

      const commentsContainer = modalDiv.querySelector('#commentsListModal');
      function renderComments() {
        commentsContainer.innerHTML = '';
        if (!thread.comments || thread.comments.length === 0) {
          commentsContainer.innerHTML = '<div style="padding: 12px; opacity:0.7;">💬 No comments yet. Be the first!</div>';
          return;
        }
        thread.comments.slice().reverse().forEach(c => {
          const div = document.createElement('div');
          div.className = 'comment-item';
          div.innerHTML = `<strong><i class="fas fa-user-circle"></i> ${escapeHtml(c.authorId)}</strong> 
            <div style="margin-top:5px;">${escapeHtml(c.text)}</div>
            <small style="opacity:0.6;">${new Date(c.createdAt).toLocaleString()}</small>`;
          commentsContainer.appendChild(div);
        });
      }
      renderComments();

      // Post comment
      const postBtn = modalDiv.querySelector('#postCommentBtnModal');
      postBtn.addEventListener('click', async () => {
        const commentText = modalDiv.querySelector('#newCommentText').value.trim();
        if (!commentText) return;
        try {
          const commentRes = await fetchAuth(`/threads/${thread.id}/comment`, { method: 'POST', body: JSON.stringify({ text: commentText }) });
          if (commentRes && commentRes.ok) {
            // Refresh thread data
            const updatedRes = await fetchAuth('/threads');
            if (updatedRes) {
              const updatedThreads = await updatedRes.json();
              const updatedThread = updatedThreads.find(t => t.id == thread.id);
              if (updatedThread) {
                thread.comments = updatedThread.comments;
                renderComments();
                modalDiv.querySelector('#newCommentText').value = '';
                // also refresh main feed to reflect comment count
                loadThreads();
              }
            }
          } else {
            alert('Failed to post comment');
          }
        } catch (err) { console.error(err); alert('Error posting comment.'); }
      });

      modalDiv.querySelector('#closeModalBtn').addEventListener('click', () => modalDiv.remove());
      modalDiv.addEventListener('click', (e) => { if (e.target === modalDiv) modalDiv.remove(); });
    } catch (err) {
      console.error(err);
      alert('Could not open thread');
    }
  }

  // ========== NEW THREAD MODAL (replaces prompt) ==========
  function showCreateThreadModal() {
    const modalDiv = document.createElement('div');
    modalDiv.className = 'modal-overlay';
    modalDiv.innerHTML = `
      <div class="modal-box">
        <h2><i class="fas fa-feather-alt"></i> Start a new discussion</h2>
        <input type="text" id="newThreadTitle" placeholder="Thread title" style="margin-bottom: 1rem;">
        <textarea id="newThreadContent" rows="5" placeholder="Describe your question, idea, or debug journey..."></textarea>
        <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 1rem;">
          <button id="confirmThreadBtn" class="btn-primary">Publish</button>
          <button id="cancelThreadBtn" class="btn-small" style="background:#444;">Cancel</button>
        </div>
      </div>
    `;
    document.body.appendChild(modalDiv);
    const confirmBtn = modalDiv.querySelector('#confirmThreadBtn');
    const cancelBtn = modalDiv.querySelector('#cancelThreadBtn');
    confirmBtn.addEventListener('click', async () => {
      const title = modalDiv.querySelector('#newThreadTitle').value.trim();
      const content = modalDiv.querySelector('#newThreadContent').value.trim();
      if (!title || !content) {
        alert('Please fill both title and content.');
        return;
      }
      try {
        const res = await fetchAuth('/threads', { method: 'POST', body: JSON.stringify({ title, content, category: 'General' }) });
        if (res && res.ok) {
          modalDiv.remove();
          loadThreads();
        } else {
          alert('Failed to create thread.');
        }
      } catch (err) { alert(err.message); }
    });
    cancelBtn.addEventListener('click', () => modalDiv.remove());
    modalDiv.addEventListener('click', (e) => { if (e.target === modalDiv) modalDiv.remove(); });
  }

  // ========== CONTACT ADMIN MODAL (improved) ==========
  function showContactAdminModal() {
    const modalDiv = document.createElement('div');
    modalDiv.className = 'modal-overlay';
    modalDiv.innerHTML = `
      <div class="modal-box">
        <h3 style="color:#ff3b7c"><i class="fas fa-headset"></i> Message to Admin</h3>
        <textarea id="adminMsgInput" rows="4" placeholder="Report an issue, request support, or give feedback..."></textarea>
        <div id="contactResultMsg" style="margin: 8px 0; font-size:0.8rem;"></div>
        <div style="display: flex; gap: 12px; justify-content: flex-end;">
          <button id="sendAdminMsgBtn" class="btn-primary">Send</button>
          <button id="closeContactModal" class="btn-small">Cancel</button>
        </div>
      </div>
    `;
    document.body.appendChild(modalDiv);
    const msgField = modalDiv.querySelector('#adminMsgInput');
    const resultDiv = modalDiv.querySelector('#contactResultMsg');
    const sendBtn = modalDiv.querySelector('#sendAdminMsgBtn');
    const closeBtn = modalDiv.querySelector('#closeContactModal');

    sendBtn.addEventListener('click', async () => {
      const msg = msgField.value.trim();
      if (!msg) {
        resultDiv.innerHTML = '<span style="color:#ff004c">Please enter a message.</span>';
        return;
      }
      resultDiv.innerHTML = '<span style="color:#00f0ff"><i class="fas fa-spinner fa-pulse"></i> Sending...</span>';
      try {
        let adminId = null;
        // attempt to fetch admin via contact endpoint or fallback
        const contactRes = await fetchAuth('/contact-admin');
        if (contactRes && contactRes.ok) {
          const admin = await contactRes.json();
          adminId = admin.id;
        } else {
          // fallback: fetch users from admin endpoint (if accessible)
          const usersRes = await fetchAuth('/admin/users');
          if (usersRes && usersRes.ok) {
            const users = await usersRes.json();
            const adminUser = users.find(u => u.role === 'admin');
            if (adminUser) adminId = adminUser.id;
          }
        }
        if (!adminId) {
          resultDiv.innerHTML = '<span style="color:#ff004c">Admin not reachable. Please try later.</span>';
          return;
        }
        const sendMsg = await fetchAuth('/messages', {
          method: 'POST',
          body: JSON.stringify({ to: adminId, text: `[Contact Form] ${msg}` })
        });
        if (sendMsg && sendMsg.ok) {
          resultDiv.innerHTML = '<span style="color:#00ffaa">✅ Message sent! Admin will reply soon.</span>';
          msgField.value = '';
          setTimeout(() => modalDiv.remove(), 1800);
        } else {
          resultDiv.innerHTML = '<span style="color:#ff004c">❌ Failed to send. Try again.</span>';
        }
      } catch (err) {
        console.error(err);
        resultDiv.innerHTML = '<span style="color:#ff004c">Error sending message.</span>';
      }
    });

    closeBtn.addEventListener('click', () => modalDiv.remove());
    modalDiv.addEventListener('click', (e) => { if (e.target === modalDiv) modalDiv.remove(); });
  }

  // ========== THEME TOGGLE ==========
  function initTheme() {
    const stored = localStorage.getItem('forumTheme');
    if (stored === 'light') document.body.classList.add('light');
    const themeBtn = document.getElementById('themeToggle');
    if (themeBtn) {
      themeBtn.addEventListener('click', () => {
        document.body.classList.toggle('light');
        const isLight = document.body.classList.contains('light');
        localStorage.setItem('forumTheme', isLight ? 'light' : 'dark');
      });
    }
  }

  // ========== LOGOUT ==========
  document.getElementById('logoutBtn')?.addEventListener('click', (e) => {
    e.preventDefault();
    localStorage.removeItem('token');
    window.location.href = '/login.html';
  });

  // ========== EVENT LISTENERS ==========
  document.getElementById('newThreadBtn')?.addEventListener('click', showCreateThreadModal);
  document.getElementById('contactAdminBtn')?.addEventListener('click', showContactAdminModal);

  // initial load
  initTheme();
  loadThreads();
</script>
<footer>
  <i class="fas fa-bug"></i> 404 DEV Forum — Where developers debug together
</footer>
</body>
</html>
