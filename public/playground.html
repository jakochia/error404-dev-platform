<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>404 DEV | Code Playground // GLITCH EXEC</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230b0f1a'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' font-weight='bold' font-family='monospace' fill='%2300f0ff' stroke='%23ff004c' stroke-width='3' filter='url(%23glow)'%3E404%3C/text%3E%3Cdefs%3E%3Cfilter id='glow'%3E%3CfeGaussianBlur stdDeviation='2' result='coloredBlur'/%3E%3CfeMerge%3E%3CfeMergeNode in='coloredBlur'/%3E%3CfeMergeNode in='SourceGraphic'/%3E%3C/feMerge%3E%3C/filter%3E%3C/defs%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at 10% 20%, #0a0c18 0%, #010105 100%);
      font-family: 'Inter', system-ui, sans-serif;
      color: #eef5ff;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* animated cyber background */
    .cyber-grid {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(0, 240, 255, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.06) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }
    .noise {
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 1;
      mix-blend-mode: overlay;
    }
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.3;
      z-index: 0;
      pointer-events: none;
    }
    .orb-1 { width: 60vw; height: 60vw; background: radial-gradient(circle, #ff1a6e, transparent); top: -30vh; left: -20vw; }
    .orb-2 { width: 70vw; height: 70vw; background: radial-gradient(circle, #00f0ff, transparent); bottom: -40vh; right: -20vw; animation: floatOrb 20s infinite alternate; }
    @keyframes floatOrb { 0% { transform: translate(0,0); } 100% { transform: translate(6%, 10%); } }

    /* navbar – glass morph */
    .navbar {
      backdrop-filter: blur(16px);
      background: rgba(5, 10, 25, 0.75);
      border-radius: 60px;
      margin: 1rem 1.5rem;
      padding: 0.6rem 1.8rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 12px;
      border: 1px solid rgba(255, 51, 102, 0.5);
      box-shadow: 0 0 25px rgba(255, 51, 102, 0.25);
      position: relative;
      z-index: 20;
    }
    .nav-link {
      color: #ccd6ff;
      text-decoration: none;
      font-weight: 500;
      padding: 0.5rem 1rem;
      border-radius: 40px;
      transition: 0.2s;
      font-size: 0.85rem;
    }
    .nav-link:hover {
      background: rgba(0, 240, 255, 0.2);
      color: #0ff;
      transform: translateY(-2px);
      box-shadow: 0 0 10px rgba(0,240,255,0.4);
    }
    .btn-small {
      background: #ff1a6e;
      border: none;
      padding: 6px 14px;
      border-radius: 40px;
      color: white;
      cursor: pointer;
      transition: 0.2s;
      font-weight: 500;
    }
    .btn-small:hover {
      background: #00f0ff;
      box-shadow: 0 0 14px #0ff;
      transform: scale(1.02);
    }

    .container {
      max-width: 1500px;
      margin: 1rem auto;
      padding: 0 1.5rem 2rem;
      position: relative;
      z-index: 15;
    }

    h1 {
      font-size: clamp(2rem, 8vw, 3.5rem);
      font-weight: 800;
      background: linear-gradient(135deg, #ff1a6e, #00f0ff, #ff1a6e);
      background-size: 200% auto;
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      margin-bottom: 2rem;
      text-align: center;
      animation: glitchPulse 2.5s infinite alternate;
    }
    @keyframes glitchPulse {
      0% { text-shadow: 0 0 2px #ff1a6e; filter: blur(0);}
      100% { text-shadow: 0 0 15px #00f0ff; filter: blur(0.3px);}
    }

    /* playground layout */
    .playground-layout {
      display: flex;
      gap: 28px;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }
    .editor-panel, .preview-panel {
      flex: 1;
      min-width: 320px;
    }
    .glass-card {
      background: rgba(10, 15, 30, 0.7);
      backdrop-filter: blur(16px);
      border-radius: 32px;
      border: 1px solid rgba(255, 51, 102, 0.5);
      padding: 1.6rem;
      transition: all 0.25s;
      box-shadow: 0 10px 25px -8px rgba(0,0,0,0.4);
    }
    .glass-card:hover {
      border-color: #0ff;
      box-shadow: 0 0 28px rgba(0, 240, 255, 0.25);
      transform: translateY(-2px);
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 10px;
    }
    .panel-header h3 {
      font-size: 1.4rem;
      background: linear-gradient(145deg, #fff, #ffb3d1);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    /* custom select */
    .cyber-select {
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid #ff3366;
      border-radius: 60px;
      padding: 8px 18px;
      color: #0ff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .cyber-select:focus {
      border-color: #0ff;
      outline: none;
      box-shadow: 0 0 12px #0ff;
    }

    /* code editor area */
    .code-editor {
      width: 100%;
      height: 320px;
      font-family: 'JetBrains Mono', monospace;
      background: #03060c;
      color: #0ff;
      border: 1px solid rgba(255, 51, 102, 0.6);
      border-radius: 24px;
      padding: 18px;
      font-size: 0.9rem;
      line-height: 1.5;
      resize: vertical;
      transition: 0.2s;
      tab-size: 2;
    }
    .code-editor:focus {
      border-color: #0ff;
      box-shadow: 0 0 18px #0ff6;
      outline: none;
    }

    /* output area */
    .output-pane {
      background: #03060c;
      border-radius: 24px;
      padding: 1rem;
      min-height: 320px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      border: 1px solid rgba(255, 51, 102, 0.4);
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .output-pane iframe {
      width: 100%;
      height: 400px;
      border: none;
      background: white;
      border-radius: 20px;
    }

    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 18px;
      flex-wrap: wrap;
    }
    .btn {
      background: linear-gradient(95deg, #ff004c, #c4003b);
      border: none;
      padding: 10px 22px;
      border-radius: 60px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      transition: 0.2s;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-outline {
      background: transparent;
      border: 1px solid #ff3366;
      box-shadow: none;
    }
    .btn-outline:hover {
      background: rgba(255, 51, 102, 0.2);
      border-color: #0ff;
    }
    .btn:hover {
      background: linear-gradient(95deg, #00c3ff, #0080aa);
      box-shadow: 0 0 18px #0ff;
      transform: scale(1.02);
    }

    /* snippets */
    .snippets-section {
      margin-top: 0.5rem;
    }
    #snippetsList {
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-height: 280px;
      overflow-y: auto;
      padding-right: 8px;
    }
    .snippet-item {
      background: #0a0e1a;
      padding: 0.8rem 1.2rem;
      border-radius: 24px;
      border-left: 5px solid #ff004c;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      transition: 0.2s;
    }
    .snippet-item:hover {
      background: #12172a;
      border-left-color: #0ff;
    }
    .snippet-title {
      font-family: monospace;
      font-weight: 600;
      color: #ffb3c6;
    }

    /* scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0a0c14; border-radius: 6px; }
    ::-webkit-scrollbar-thumb { background: #ff3366; border-radius: 6px; }

    /* light theme override */
    body.light .glass-card { background: rgba(240, 242, 255, 0.9); color: #111; }
    body.light .navbar a { color: #111; }
    body.light .code-editor, body.light .output-pane { background: #f5f5ff; color: #111; border-color: #ff3366; }
    body.light .cyber-select { background: white; color: #111; }
    @media (max-width: 860px) {
      .navbar { gap: 8px; margin: 0.8rem; }
      .container { padding: 0 1rem; }
    }
  </style>
</head>
<body>
  <div class="cyber-grid"></div>
  <div class="noise"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="navbar">
    <a href="/user-dashboard.html" class="nav-link">🏠 Dashboard</a>
    <a href="/coding-hub.html" class="nav-link">💻 Coding Hub</a>
    <a href="/forum.html" class="nav-link">💬 Forum</a>
    <a href="/playground.html" class="nav-link">🧪 Playground</a>
    <a href="/toolkit.html" class="nav-link">🛠️ Toolkit</a>
    <a href="/messages.html" class="nav-link">💬 Messages</a>
    <button id="themeToggle" class="btn-small">🌓</button>
    <a href="#" id="logoutBtn" class="nav-link">🚪 Logout</a>
  </div>

  <div class="container">
    <h1>⚡ CODE PLAYGROUND // LIVE EXECUTION</h1>
    <div class="playground-layout">
      <div class="editor-panel glass-card">
        <div class="panel-header">
          <h3>✧ EDITOR</h3>
          <select id="languageSelect" class="cyber-select">
            <option value="javascript">JavaScript (in‑browser)</option>
            <option value="html">HTML/CSS (live preview)</option>
            <option value="python">Python (backend)</option>
          </select>
        </div>
        <textarea id="codeEditor" class="code-editor" spellcheck="false">// Welcome to 404 Playground
console.log("Hello, Glitch Rebel!");
document.body?.style && (document.body.style.background = "#0a0c18");
alert("Code runs safely in sandbox");</textarea>
        <div class="button-group">
          <button id="runCodeBtn" class="btn">▶ RUN CODE</button>
          <button id="saveSnippet" class="btn btn-outline">💾 SAVE SNIPPET</button>
          <button id="clearOutputBtn" class="btn btn-outline">🗑️ CLEAR OUTPUT</button>
        </div>
      </div>
      <div class="preview-panel glass-card">
        <div class="panel-header">
          <h3>📟 OUTPUT / PREVIEW</h3>
          <span id="execStatus" style="font-size:0.7rem; color:#0ff;">● ready</span>
        </div>
        <div id="output" class="output-pane"></div>
      </div>
    </div>
    <div class="glass-card snippets-section">
      <div class="panel-header">
        <h3>📚 SAVED SNIPPETS</h3>
        <button id="clearAllSnippets" class="btn-small" style="background:#333;">Clear All</button>
      </div>
      <div id="snippetsList"></div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script>
    // ---------- ENHANCED CODE EXECUTION (front-end sandbox + backend fallback) ----------
    const languageSelect = document.getElementById('languageSelect');
    const codeEditor = document.getElementById('codeEditor');
    const outputDiv = document.getElementById('output');
    const execStatus = document.getElementById('execStatus');

    // Helper to safely execute JavaScript in a sandbox (no DOM pollution, capture logs)
    function executeJS(code) {
      let logs = [];
      let errors = null;
      const originalConsoleLog = console.log;
      const originalConsoleError = console.error;
      console.log = (...args) => { logs.push(args.map(a => String(a)).join(' ')); originalConsoleLog(...args); };
      console.error = (...args) => { logs.push('❌ ' + args.map(a => String(a)).join(' ')); originalConsoleError(...args); };
      try {
        // Use Function constructor to avoid leaking scope, but allow access to globalThis safely
        const asyncWrapper = new Function('sandboxConsole', `
          try {
            ${code}
          } catch(e) {
            console.error(e.message);
          }
        `);
        asyncWrapper(console);
      } catch (err) {
        errors = err.message;
        logs.push(`🚫 Execution error: ${err.message}`);
      } finally {
        console.log = originalConsoleLog;
        console.error = originalConsoleError;
      }
      return { output: logs.join('\n') || (errors ? `Error: ${errors}` : '✔️ Code executed (no output)'), error: errors };
    }

    // HTML preview
    function renderHTML(htmlCode) {
      const safeDoc = htmlCode.replace(/</g, '&lt;').replace(/>/g, '&gt;');
      // We'll embed in iframe srcdoc with proper escaping
      return `<iframe srcdoc="${htmlCode.replace(/"/g, '&quot;').replace(/'/g, "&#39;")}" style="width:100%; height:420px; border:none; background:white; border-radius:16px;"></iframe>`;
    }

    // Main run function (preserves original fetchAuth for Python, adds front-end for JS/HTML)
    document.getElementById('runCodeBtn').addEventListener('click', async () => {
      const language = languageSelect.value;
      const code = codeEditor.value;
      outputDiv.innerHTML = '';
      execStatus.innerHTML = '⏳ executing...';
      execStatus.style.color = '#ffaa44';

      try {
        if (language === 'javascript') {
          // client-side JS execution (safe sandbox)
          setTimeout(() => {
            const result = executeJS(code);
            outputDiv.innerText = result.output || '✔️ No output from script.';
            if (result.error) outputDiv.style.color = '#ff8888';
            else outputDiv.style.color = '#aaffdd';
            execStatus.innerHTML = '✅ done (local JS)';
            execStatus.style.color = '#0ff';
          }, 30);
        } 
        else if (language === 'html') {
          // HTML/CSS preview
          outputDiv.innerHTML = renderHTML(code);
          execStatus.innerHTML = '✅ live preview ready';
          execStatus.style.color = '#0ff';
        } 
        else if (language === 'python') {
          // call backend (original fetchAuth)
          const res = await fetchAuth('/execute', {
            method: 'POST',
            body: JSON.stringify({ language: 'python', code })
          });
          const data = await res.json();
          outputDiv.innerText = data.output || data.error || '⚠️ No output from Python backend.';
          execStatus.innerHTML = '✅ backend executed';
          execStatus.style.color = '#0ff';
        }
      } catch (err) {
        outputDiv.innerText = `🔥 Execution error: ${err.message}`;
        execStatus.innerHTML = '❌ failed';
        execStatus.style.color = '#ff1a6e';
      }
    });

    // Clear output button
    document.getElementById('clearOutputBtn').addEventListener('click', () => {
      outputDiv.innerHTML = '';
      execStatus.innerHTML = '● cleared';
      execStatus.style.color = '#0ff';
    });

    // ---------- SNIPPETS (localStorage) – beautified ----------
    let snippets = JSON.parse(localStorage.getItem('playground_snippets') || '[]');
    function renderSnippets() {
      const container = document.getElementById('snippetsList');
      container.innerHTML = '';
      snippets.forEach((s, idx) => {
        const div = document.createElement('div');
        div.className = 'snippet-item';
        const preview = s.length > 60 ? s.substring(0, 60) + '…' : s;
        div.innerHTML = `
          <div class="snippet-title">📌 Snippet #${idx+1}</div>
          <div style="font-family: monospace; font-size:0.75rem; color:#aaa; max-width:300px; overflow:hidden;">${escapeHtml(preview)}</div>
          <div>
            <button class="btn-small load-snippet" data-idx="${idx}">Load</button>
            <button class="btn-small del-snippet" data-idx="${idx}" style="background:#444;">Delete</button>
          </div>
        `;
        container.appendChild(div);
      });
      document.querySelectorAll('.load-snippet').forEach(btn => btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset.idx);
        codeEditor.value = snippets[idx];
      }));
      document.querySelectorAll('.del-snippet').forEach(btn => btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset.idx);
        snippets.splice(idx, 1);
        localStorage.setItem('playground_snippets', JSON.stringify(snippets));
        renderSnippets();
      }));
    }

    document.getElementById('saveSnippet').addEventListener('click', () => {
      const code = codeEditor.value;
      if (!code.trim()) return;
      snippets.push(code);
      localStorage.setItem('playground_snippets', JSON.stringify(snippets));
      renderSnippets();
    });
    document.getElementById('clearAllSnippets').addEventListener('click', () => {
      if (confirm('Delete ALL saved snippets?')) {
        snippets = [];
        localStorage.setItem('playground_snippets', JSON.stringify(snippets));
        renderSnippets();
      }
    });

    function escapeHtml(str) {
      return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
      });
    }

    renderSnippets();

    // Logout & theme (preserve original)
    document.getElementById('logoutBtn').addEventListener('click', logout);
    initTheme();

    // Extra: add sample snippets to show capabilities
    if (snippets.length === 0) {
      snippets.push(`console.log("Welcome to 404 Playground!");
console.log("Run JavaScript, HTML, Python!");`);
      snippets.push(`<div style="background: linear-gradient(145deg, #ff1a6e, #0ff); padding:2rem; border-radius:2rem; text-align:center">
  <h1 style="color:white">GLITCH MODE</h1>
  <p>Live HTML preview works!</p>
</div>`);
      localStorage.setItem('playground_snippets', JSON.stringify(snippets));
      renderSnippets();
    }
  </script>
</body>
</html>
