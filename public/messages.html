<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 DEV | Messages & Groups</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .chat-layout { display: flex; gap: 20px; flex-wrap: wrap; }
    .sidebar-chat { flex: 1; min-width: 250px; background: #0a0c14; border-radius: 12px; padding: 15px; }
    .chat-area { flex: 2; min-width: 300px; background: #0a0c14; border-radius: 12px; padding: 15px; }
    .online-dot { display: inline-block; width: 8px; height: 8px; background: #00ff00; border-radius: 50%; margin-left: 8px; }
    .group-item, .user-item { padding: 8px; cursor: pointer; border-bottom: 1px solid #333; }
    .group-item:hover, .user-item:hover { background: #1a1f2e; }
    .message-bubble {
      display: inline-block;
      padding: 8px 12px;
      border-radius: 18px;
      max-width: 80%;
      margin: 4px 0;
    }
    .message-right { text-align: right; }
    .message-right .message-bubble { background: #ff004c; color: white; }
    .message-left .message-bubble { background: #1a1f2e; color: #eef5ff; }
  </style>
</head>
<body>
<div class="navbar">
  <a href="/user-dashboard.html">🏠 Dashboard</a>
  <button id="themeToggle" class="btn-small">🌓</button>
  <a href="#" id="logoutBtn">Logout</a>
</div>
<div class="container">
  <h1>💬 Messages & Groups</h1>
  <div class="chat-layout">
    <div class="sidebar-chat glass-card">
      <h3>👥 Your Groups <button class="refresh-btn" id="refreshGroups" style="background:none; border:1px solid #00f0ff; border-radius:20px; padding:2px 8px;">↻</button></h3>
      <div id="groupsList">Loading groups...</div>
      <hr>
      <h3>🟢 Online Users <button class="refresh-btn" id="refreshOnline" style="background:none; border:1px solid #00f0ff; border-radius:20px; padding:2px 8px;">↻</button></h3>
      <div id="onlineUsersList">Loading online users...</div>
      <hr>
      <h3>📩 Direct Conversations <button class="refresh-btn" id="refreshConvs" style="background:none; border:1px solid #00f0ff; border-radius:20px; padding:2px 8px;">↻</button></h3>
      <div id="convList">Loading conversations...</div>
    </div>
    <div class="chat-area glass-card">
      <h3 id="chatHeader">Select a conversation</h3>
      <div id="chatMessages" style="height:400px; overflow-y:auto; background:#0f111f; padding:10px; border-radius:8px;"></div>
      <textarea id="msgInput" rows="2" placeholder="Type message..."></textarea>
      <button id="sendMsg" class="btn">Send</button>
    </div>
  </div>
</div>
<script>
  // ========== AUTH FETCH ==========
  function getToken() { return localStorage.getItem('token'); }
  
  async function fetchAuth(url, options = {}) {
    const token = getToken();
    if (!token) { window.location.href = '/login.html'; return; }
    const headers = { 'Content-Type': 'application/json', ...options.headers };
    if (token) headers['Authorization'] = `Bearer ${token}`;
    const res = await fetch('/api' + url, { ...options, headers });
    if (res.status === 401) { localStorage.removeItem('token'); window.location.href = '/login.html'; throw new Error('Unauthorized'); }
    return res;
  }

  // ========== GLOBAL VARIABLES ==========
  let currentChatType = null;
  let currentChatId = null;
  let currentChatName = null;
  let allUsers = [];      // filled from /api/users
  let currentUserId = null;

  async function getCurrentUserId() {
    if (currentUserId) return currentUserId;
    const res = await fetchAuth('/user/profile');
    if (res && res.ok) {
      const user = await res.json();
      currentUserId = user.id;
      return currentUserId;
    }
    return null;
  }

  // Load all users (id & username) for display
  async function loadUsers() {
    try {
      const res = await fetchAuth('/users');
      if (res && res.ok) allUsers = await res.json();
      else console.warn('Failed to load user list');
    } catch (err) {
      console.error('Error loading users:', err);
    }
  }

  // Load groups the user belongs to
  async function loadGroups() {
    const container = document.getElementById('groupsList');
    container.innerHTML = 'Loading groups...';
    try {
      const res = await fetchAuth('/groups');
      if (!res) throw new Error('No response');
      const groups = await res.json();
      console.log('Groups:', groups);
      if (!groups || groups.length === 0) {
        container.innerHTML = '<p>You are not in any group yet.</p>';
        return;
      }
      container.innerHTML = groups.map(g => `<div class="group-item" onclick="openGroup('${g.id}', '${escapeHtml(g.name)}')">👥 ${escapeHtml(g.name)}</div>`).join('');
    } catch (err) {
      console.error('Load groups error:', err);
      container.innerHTML = '<p>Error loading groups.</p>';
    }
  }

  // Load online users
  async function loadOnlineUsers() {
    const container = document.getElementById('onlineUsersList');
    container.innerHTML = 'Loading online users...';
    try {
      const res = await fetchAuth('/online-users');
      if (!res) throw new Error('No response');
      const online = await res.json();
      console.log('Online users:', online);
      if (!online || online.length === 0) {
        container.innerHTML = '<p>No one online</p>';
      } else {
        container.innerHTML = online.map(u => `<div class="user-item" onclick="startDM('${u.id}', '${escapeHtml(u.username)}')">${escapeHtml(u.username)}<span class="online-dot"></span></div>`).join('');
      }
    } catch (err) {
      console.error('Load online users error:', err);
      container.innerHTML = '<p>Error loading online users.</p>';
    }
  }

  // Load direct conversations
  async function loadConversations() {
    const container = document.getElementById('convList');
    container.innerHTML = 'Loading conversations...';
    try {
      const res = await fetchAuth('/conversations');
      if (!res) throw new Error('No response');
      const convs = await res.json();
      console.log('Conversations:', convs);
      if (!convs || convs.length === 0) {
        container.innerHTML = '<p>No direct messages yet.</p>';
        return;
      }
      container.innerHTML = convs.map(c => `<div class="user-item" onclick="startDM('${c.otherId}', '${escapeHtml(c.otherName)}')"><strong>${escapeHtml(c.otherName)}</strong><br><small>${escapeHtml(c.lastMsg)}</small></div>`).join('');
    } catch (err) {
      console.error('Load conversations error:', err);
      container.innerHTML = '<p>Error loading conversations.</p>';
    }
  }

  // Open a direct message conversation
  window.startDM = async function(otherId, name) {
    currentChatType = 'user';
    currentChatId = otherId;
    currentChatName = name;
    document.getElementById('chatHeader').innerText = `Chat with ${name}`;
    try {
      const res = await fetchAuth(`/messages/${otherId}`);
      if (!res) throw new Error('No response');
      const msgs = await res.json();
      const container = document.getElementById('chatMessages');
      const myId = await getCurrentUserId();
      container.innerHTML = '';
      for (const m of msgs) {
        const isFromMe = m.from === myId;
        const div = document.createElement('div');
        div.className = isFromMe ? 'message-right' : 'message-left';
        div.innerHTML = `<div class="message-bubble"><strong>${isFromMe ? 'You' : name}:</strong> ${escapeHtml(m.text)}<br><small style="font-size:0.7rem;">${new Date(m.createdAt).toLocaleString()}</small></div>`;
        container.appendChild(div);
      }
      container.scrollTop = container.scrollHeight;
    } catch (err) {
      console.error('Open DM error:', err);
      document.getElementById('chatMessages').innerHTML = '<p>Error loading messages.</p>';
    }
  };

  // Open a group conversation
  window.openGroup = async function(groupId, name) {
    currentChatType = 'group';
    currentChatId = groupId;
    currentChatName = name;
    document.getElementById('chatHeader').innerText = `Group: ${name}`;
    try {
      const res = await fetchAuth(`/groups/${groupId}/messages`);
      if (!res) throw new Error('No response');
      const msgs = await res.json();
      const container = document.getElementById('chatMessages');
      container.innerHTML = '';
      for (const m of msgs) {
        const sender = allUsers.find(u => u.id === m.from)?.username || m.from;
        const div = document.createElement('div');
        div.className = 'message-left';
        div.innerHTML = `<div class="message-bubble"><strong>${escapeHtml(sender)}:</strong> ${escapeHtml(m.text)}<br><small style="font-size:0.7rem;">${new Date(m.createdAt).toLocaleString()}</small></div>`;
        container.appendChild(div);
      }
      container.scrollTop = container.scrollHeight;
    } catch (err) {
      console.error('Open group error:', err);
      document.getElementById('chatMessages').innerHTML = '<p>Error loading messages.</p>';
    }
  };

  // Send a message
  document.getElementById('sendMsg').onclick = async () => {
    const text = document.getElementById('msgInput').value.trim();
    if (!text || !currentChatId) return;
    if (currentChatType === 'user') {
      const res = await fetchAuth('/messages', { method: 'POST', body: JSON.stringify({ to: currentChatId, text }) });
      if (res && res.ok) {
        document.getElementById('msgInput').value = '';
        await startDM(currentChatId, currentChatName);
        loadConversations(); // update sidebar
      }
    } else if (currentChatType === 'group') {
      const res = await fetchAuth(`/groups/${currentChatId}/message`, { method: 'POST', body: JSON.stringify({ text }) });
      if (res && res.ok) {
        document.getElementById('msgInput').value = '';
        await openGroup(currentChatId, currentChatName);
      }
    }
  };

  // Refresh buttons
  document.getElementById('refreshGroups').onclick = () => { loadGroups(); };
  document.getElementById('refreshOnline').onclick = () => { loadOnlineUsers(); };
  document.getElementById('refreshConvs').onclick = () => { loadConversations(); };

  // Online status heartbeat
  async function updateOnlineStatus() {
    try { await fetchAuth('/online', { method: 'POST' }); } catch(e) {}
  }
  updateOnlineStatus();
  setInterval(updateOnlineStatus, 30000);
  window.addEventListener('beforeunload', () => {
    fetch('/api/offline', { method: 'POST', headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` } });
  });

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
  }

  // Theme switcher
  function initTheme() {
    const saved = localStorage.getItem('devTheme');
    if (saved === 'light') document.body.classList.add('light');
    document.getElementById('themeToggle')?.addEventListener('click', () => {
      document.body.classList.toggle('light');
      localStorage.setItem('devTheme', document.body.classList.contains('light') ? 'light' : 'dark');
    });
  }
  initTheme();

  document.getElementById('logoutBtn').onclick = () => {
    fetch('/api/offline', { method: 'POST', headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` } });
    localStorage.removeItem('token');
    window.location.href = '/login.html';
  };

  // Initial load
  (async () => {
    await loadUsers();
    await loadGroups();
    await loadOnlineUsers();
    await loadConversations();
  })();
</script>
</body>
</html>
