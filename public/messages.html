<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 DEV | Messages & Groups</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .chat-layout { display: flex; gap: 20px; flex-wrap: wrap; }
    .sidebar-chat { flex: 1; min-width: 250px; background: #0a0c14; border-radius: 12px; padding: 15px; }
    .chat-area { flex: 2; min-width: 300px; background: #0a0c14; border-radius: 12px; padding: 15px; }
    .online-dot { display: inline-block; width: 8px; height: 8px; background: #00ff00; border-radius: 50%; margin-left: 8px; box-shadow: 0 0 4px #00ff00; }
    .group-item, .user-item { 
      padding: 10px; 
      cursor: pointer; 
      border-bottom: 1px solid #1f2a3a; 
      transition: 0.1s;
      border-radius: 12px;
      margin: 4px 0;
      position: relative;
    }
    .group-item:hover, .user-item:hover { background: #1f2a3a; transform: translateX(4px); }
    .unread-badge {
      display: inline-block;
      background: #ff004c;
      color: white;
      border-radius: 40px;
      padding: 2px 8px;
      font-size: 0.7rem;
      margin-left: 8px;
      font-weight: bold;
    }
    .message-container { display: flex; flex-direction: column; margin-bottom: 16px; }
    .message-right { align-items: flex-end; }
    .message-left { align-items: flex-start; }
    .message-bubble {
      max-width: 70%;
      padding: 10px 16px;
      border-radius: 24px;
      word-wrap: break-word;
    }
    .message-right .message-bubble {
      background: linear-gradient(135deg, #ff004c, #ff3b7c);
      color: white;
      border-bottom-right-radius: 6px;
    }
    .message-left .message-bubble {
      background: #1e2a3a;
      color: #eef5ff;
      border-bottom-left-radius: 6px;
    }
    .message-meta { font-size: 0.7rem; margin-top: 4px; opacity: 0.7; display: flex; gap: 8px; }
    .message-right .message-meta { justify-content: flex-end; }
    .refresh-btn {
      background: none;
      border: 1px solid #00f0ff;
      border-radius: 20px;
      padding: 2px 8px;
      cursor: pointer;
      font-size: 0.7rem;
      margin-left: 8px;
      transition: 0.2s;
    }
    .refresh-btn:hover { background: rgba(0,240,255,0.2); }
    #chatMessages { background: #0a0c14; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 8px; height: 400px; overflow-y: auto; }
    .typing-indicator { font-size: 0.8rem; color: #00f0ff; margin-left: 16px; margin-bottom: 8px; }
  </style>
</head>
<body>
<div class="navbar">
  <a href="/user-dashboard.html">🏠 Dashboard</a>
  <button id="themeToggle" class="btn-small">🌓</button>
  <a href="#" id="logoutBtn">Logout</a>
</div>
<div class="container">
  <h1>💬 Messages & Groups</h1>
  <div class="chat-layout">
    <div class="sidebar-chat glass-card">
      <h3>👥 Your Groups <button class="refresh-btn" id="refreshGroups">↻</button></h3>
      <div id="groupsList">Loading groups...</div>
      <hr>
      <h3>🟢 Online Users <button class="refresh-btn" id="refreshOnline">↻</button></h3>
      <div id="onlineUsersList">Loading online users...</div>
      <hr>
      <h3>📩 Direct Conversations <button class="refresh-btn" id="refreshConvs">↻</button></h3>
      <div id="convList">Loading conversations...</div>
    </div>
    <div class="chat-area glass-card">
      <h3 id="chatHeader">Select a conversation</h3>
      <div id="chatMessages" style="height:400px; overflow-y:auto; display:flex; flex-direction:column; gap:8px;"></div>
      <textarea id="msgInput" rows="2" placeholder="Type message..."></textarea>
      <button id="sendMsg" class="btn">Send</button>
    </div>
  </div>
</div>
<script>
  // ========== AUTH FETCH ==========
  function getToken() { return localStorage.getItem('token'); }
  
  async function fetchAuth(url, options = {}) {
    const token = getToken();
    if (!token) { window.location.href = '/login.html'; return; }
    const headers = { 'Content-Type': 'application/json', ...options.headers };
    if (token) headers['Authorization'] = `Bearer ${token}`;
    const res = await fetch('/api' + url, { ...options, headers });
    if (res.status === 401) { localStorage.removeItem('token'); window.location.href = '/login.html'; throw new Error('Unauthorized'); }
    return res;
  }

  // ========== GLOBAL VARIABLES ==========
  let currentChatType = null;   // 'user' or 'group'
  let currentChatId = null;
  let currentChatName = null;
  let allUsers = [];
  let currentUserId = null;
  let pollInterval = null;

  // Store last opened timestamps
  function getLastOpened(convId) {
    const last = localStorage.getItem(`lastOpened_${convId}`);
    return last ? new Date(last) : null;
  }
  function setLastOpened(convId) {
    localStorage.setItem(`lastOpened_${convId}`, new Date().toISOString());
  }

  async function getCurrentUserId() {
    if (currentUserId) return currentUserId;
    try {
      const res = await fetchAuth('/user/profile');
      if (res && res.ok) {
        const user = await res.json();
        currentUserId = user.id;
        return currentUserId;
      }
    } catch(e) {}
    return null;
  }

  async function loadUsers() {
    try {
      const res = await fetchAuth('/users');
      if (res && res.ok) allUsers = await res.json();
      else console.warn('Failed to load user list');
    } catch (err) { console.error('Error loading users:', err); }
  }

  // Helper to extract last message time and text
  function getLastMsgInfo(conv) {
    return {
      time: new Date(conv.lastTime),
      text: conv.lastMsg
    };
  }

  // Render group list with unread indicators
  function renderGroups(groups) {
    const container = document.getElementById('groupsList');
    if (!groups || groups.length === 0) {
      container.innerHTML = '<p>You are not in any group yet.</p>';
      return;
    }
    let html = '';
    for (const g of groups) {
      const lastOpened = getLastOpened(`group_${g.id}`);
      const lastMsgTime = g.lastMessageTime ? new Date(g.lastMessageTime) : null;
      let unreadBadge = '';
      if (lastMsgTime && (!lastOpened || lastMsgTime > lastOpened)) {
        unreadBadge = '<span class="unread-badge">NEW</span>';
      }
      html += `<div class="group-item" onclick="openGroup('${g.id}', '${escapeHtml(g.name)}')">👥 ${escapeHtml(g.name)} ${unreadBadge}</div>`;
    }
    container.innerHTML = html;
  }

  // Render direct conversations with unread indicators
  function renderConversations(convs) {
    const container = document.getElementById('convList');
    if (!convs || convs.length === 0) {
      container.innerHTML = '<p>No direct messages yet.</p>';
      return;
    }
    let html = '';
    for (const c of convs) {
      const lastOpened = getLastOpened(`user_${c.otherId}`);
      const lastMsgTime = new Date(c.lastTime);
      let unreadBadge = '';
      if (lastMsgTime && (!lastOpened || lastMsgTime > lastOpened)) {
        unreadBadge = '<span class="unread-badge">NEW</span>';
      }
      html += `<div class="user-item" onclick="startDM('${c.otherId}', '${escapeHtml(c.otherName)}')"><strong>${escapeHtml(c.otherName)}</strong><br><small>${escapeHtml(c.lastMsg)}</small> ${unreadBadge}</div>`;
    }
    container.innerHTML = html;
  }

  async function loadGroups() {
    try {
      const res = await fetchAuth('/groups');
      if (!res) throw new Error('No response');
      let groups = await res.json();
      // For groups, we need to fetch last message time for each (we can get from messages endpoint? Simpler: we already have group.messages array? Not in list. We'll store lastMsgTime in group object from backend? For simplicity, we'll not show unread for groups now, but we can later.
      // For now, just display without unread.
      const container = document.getElementById('groupsList');
      if (!groups || groups.length === 0) {
        container.innerHTML = '<p>You are not in any group yet.</p>';
        return;
      }
      container.innerHTML = groups.map(g => `<div class="group-item" onclick="openGroup('${g.id}', '${escapeHtml(g.name)}')">👥 ${escapeHtml(g.name)}</div>`).join('');
    } catch (err) {
      console.error('Load groups error:', err);
      document.getElementById('groupsList').innerHTML = '<p>Error loading groups.</p>';
    }
  }

  async function loadOnlineUsers() {
    const container = document.getElementById('onlineUsersList');
    container.innerHTML = 'Loading online users...';
    try {
      const res = await fetchAuth('/online-users');
      if (!res) throw new Error('No response');
      const online = await res.json();
      if (!online || online.length === 0) {
        container.innerHTML = '<p>No one online</p>';
      } else {
        container.innerHTML = online.map(u => `<div class="user-item" onclick="startDM('${u.id}', '${escapeHtml(u.username)}')">${escapeHtml(u.username)}<span class="online-dot"></span></div>`).join('');
      }
    } catch (err) {
      console.error('Load online users error:', err);
      container.innerHTML = '<p>Error loading online users.</p>';
    }
  }

  async function loadConversations() {
    try {
      const res = await fetchAuth('/conversations');
      if (!res) throw new Error('No response');
      const convs = await res.json();
      renderConversations(convs);
    } catch (err) {
      console.error('Load conversations error:', err);
      document.getElementById('convList').innerHTML = '<p>Error loading conversations.</p>';
    }
  }

  function renderMessages(messages, otherName, isGroup = false) {
    const container = document.getElementById('chatMessages');
    container.innerHTML = '';
    for (const m of messages) {
      const isFromMe = m.from === currentUserId;
      const senderName = isGroup && !isFromMe ? (allUsers.find(u => u.id === m.from)?.username || m.from) : (isFromMe ? 'You' : otherName);
      const div = document.createElement('div');
      div.className = `message-container ${isFromMe ? 'message-right' : 'message-left'}`;
      div.innerHTML = `
        <div class="message-bubble">
          ${isGroup && !isFromMe ? `<strong>${escapeHtml(senderName)}</strong><br>` : ''}
          ${escapeHtml(m.text)}
          <div class="message-meta">
            <span>${new Date(m.createdAt).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' })}</span>
            <span>${new Date(m.createdAt).toLocaleDateString()}</span>
          </div>
        </div>
      `;
      container.appendChild(div);
    }
    container.scrollTop = container.scrollHeight;
  }

  function startPolling() {
    if (pollInterval) clearInterval(pollInterval);
    pollInterval = setInterval(async () => {
      if (!currentChatId) {
        // Still refresh conversations to update unread badges
        await loadConversations();
        return;
      }
      if (currentChatType === 'user') {
        const res = await fetchAuth(`/messages/${currentChatId}`);
        if (res && res.ok) {
          const msgs = await res.json();
          renderMessages(msgs, currentChatName, false);
          // Mark as read because we are viewing
          setLastOpened(`user_${currentChatId}`);
          await loadConversations(); // remove NEW badge
        }
      } else if (currentChatType === 'group') {
        const res = await fetchAuth(`/groups/${currentChatId}/messages`);
        if (res && res.ok) {
          const msgs = await res.json();
          renderMessages(msgs, currentChatName, true);
          setLastOpened(`group_${currentChatId}`);
          // No conversation list for groups, but we could reload groups list to update unread (we skip for simplicity)
        }
      }
      // Also refresh conversations list to update unread badges for other conversations
      if (currentChatType === 'user') {
        await loadConversations();
      }
    }, 5000);
  }

  window.startDM = async function(otherId, name) {
    currentChatType = 'user';
    currentChatId = otherId;
    currentChatName = name;
    document.getElementById('chatHeader').innerText = `Chat with ${name}`;
    // Mark as read when opened
    setLastOpened(`user_${otherId}`);
    try {
      const res = await fetchAuth(`/messages/${otherId}`);
      if (!res) throw new Error('No response');
      const msgs = await res.json();
      renderMessages(msgs, name, false);
      startPolling();
      await loadConversations(); // to remove unread badge
    } catch (err) {
      console.error('Open DM error:', err);
      document.getElementById('chatMessages').innerHTML = '<p>Error loading messages.</p>';
    }
  };

  window.openGroup = async function(groupId, name) {
    currentChatType = 'group';
    currentChatId = groupId;
    currentChatName = name;
    document.getElementById('chatHeader').innerText = `Group: ${name}`;
    setLastOpened(`group_${groupId}`);
    try {
      const res = await fetchAuth(`/groups/${groupId}/messages`);
      if (!res) throw new Error('No response');
      const msgs = await res.json();
      renderMessages(msgs, name, true);
      startPolling();
    } catch (err) {
      console.error('Open group error:', err);
      document.getElementById('chatMessages').innerHTML = '<p>Error loading messages.</p>';
    }
  };

  document.getElementById('sendMsg').onclick = async () => {
    const text = document.getElementById('msgInput').value.trim();
    if (!text || !currentChatId) return;
    if (currentChatType === 'user') {
      const res = await fetchAuth('/messages', { method: 'POST', body: JSON.stringify({ to: currentChatId, text }) });
      if (res && res.ok) {
        document.getElementById('msgInput').value = '';
        // Refresh messages
        const msgsRes = await fetchAuth(`/messages/${currentChatId}`);
        if (msgsRes && msgsRes.ok) {
          const msgs = await msgsRes.json();
          renderMessages(msgs, currentChatName, false);
          setLastOpened(`user_${currentChatId}`); // mark own messages as read
          await loadConversations();
        }
      }
    } else if (currentChatType === 'group') {
      const res = await fetchAuth(`/groups/${currentChatId}/message`, { method: 'POST', body: JSON.stringify({ text }) });
      if (res && res.ok) {
        document.getElementById('msgInput').value = '';
        const msgsRes = await fetchAuth(`/groups/${currentChatId}/messages`);
        if (msgsRes && msgsRes.ok) {
          const msgs = await msgsRes.json();
          renderMessages(msgs, currentChatName, true);
          setLastOpened(`group_${currentChatId}`);
        }
      }
    }
  };

  document.getElementById('refreshGroups').onclick = loadGroups;
  document.getElementById('refreshOnline').onclick = loadOnlineUsers;
  document.getElementById('refreshConvs').onclick = loadConversations;

  async function updateOnlineStatus() {
    try { await fetchAuth('/online', { method: 'POST' }); } catch(e) {}
  }
  updateOnlineStatus();
  setInterval(updateOnlineStatus, 30000);
  window.addEventListener('beforeunload', () => {
    if (pollInterval) clearInterval(pollInterval);
    fetch('/api/offline', { method: 'POST', headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` } });
  });

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
  }

  function initTheme() {
    const saved = localStorage.getItem('devTheme');
    if (saved === 'light') document.body.classList.add('light');
    document.getElementById('themeToggle')?.addEventListener('click', () => {
      document.body.classList.toggle('light');
      localStorage.setItem('devTheme', document.body.classList.contains('light') ? 'light' : 'dark');
    });
  }
  initTheme();
  document.getElementById('logoutBtn').onclick = () => {
    if (pollInterval) clearInterval(pollInterval);
    fetch('/api/offline', { method: 'POST', headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` } });
    localStorage.removeItem('token');
    window.location.href = '/login.html';
  };

  (async () => {
    await loadUsers();
    await getCurrentUserId();
    await loadGroups();
    await loadOnlineUsers();
    await loadConversations();
    // Start polling to check for new messages even without open chat? This will refresh conversations list every 5 seconds.
    setInterval(() => {
      if (!currentChatId) loadConversations();
    }, 5000);
  })();
</script>
</body>
</html>
